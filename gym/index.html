a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.01em}
.brand svg{width:40px;height:28px}
.nav{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px;padding:10px 4px;color:var(--ink)}
.nav svg{width:20px;height:20px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--steel)}
.iconbtn svg{width:24px;height:24px}

/* type */
.display{font-family:var(--disp);font-weight:900;font-size:52px;line-height:.92;letter-spacing:-.005em;margin:6px 0 8px}
.display.md{font-size:42px}
.lede{color:var(--steel);font-size:18px;margin-bottom:22px;max-width:34ch}
.h2{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;margin:30px 0 12px}
.small{font-size:14px;color:var(--steel)}

/* hero */
.hero{display:block;width:100%;background:var(--ink);color:#fff;border-radius:22px;padding:18px 20px 22px;margin-bottom:14px}
.hero .bbell{display:block;width:100%;height:auto;margin:2px 0 14px}
.hero-t{display:block;font-family:var(--disp);font-weight:900;font-size:36px;line-height:1}
.hero-d{display:block;color:#B9C0C6;margin-top:6px;font-size:16px}

/* rows */
.list{background:var(--sheet);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.row-ic svg{width:26px;height:26px}
.row-b{flex:1;min-width:0}
.row-b b{display:block;font-size:17px}
.row-b small{display:block;color:var(--steel);font-size:14px;margin-top:1px}
.chev{color:var(--steel);font-size:24px;line-height:1}
.plate{display:inline-block;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 18%,var(--pc) 19% 100%);flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:16px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:20px;height:20px}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:700;text-decoration:none;color:var(--ink)}
.mini svg{width:18px;height:18px}
.mini.danger{color:var(--red)}

/* sticky bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(232,234,235,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:524px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .btn{flex:1;width:auto}
.dock .sq{width:52px;height:52px;flex:none;border-radius:14px;background:var(--sheet);display:grid;place-items:center}
.dock .sq svg{width:22px;height:22px}
.dock .sq.on{background:var(--ink);color:#fff}
.dock .info{flex:1;font-size:14px;color:var(--steel);line-height:1.3}
.dock .info b{display:block;color:var(--ink);font-size:16px}

/* wizard */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sheet);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:96px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.tile svg{width:32px;height:32px}
.tile b{font-size:17px}
.tile small{font-size:13px;color:var(--steel);margin-top:-6px}
.tile.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.tile:disabled{opacity:.45;cursor:default}
.opts{background:var(--sheet);border-radius:18px;overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt .ob{flex:1}
.opt b{display:block}
.opt small{display:block;font-size:14px;color:var(--steel)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.opt.on .radio{box-shadow:inset 0 0 0 7px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sheet);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px}
.chip.on{background:var(--ink);color:#fff}
.chip.sm{padding:8px 13px;font-size:14px}
.qmark{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:700;font-size:14px;flex:none}

/* session */
.figs{display:flex;gap:26px;margin:4px 0 22px}
.figs div{display:flex;flex-direction:column}
.figs b{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.9}
.figs span{font-size:13px;color:var(--steel);margin-top:4px}
.s-bar{display:block;width:100%;height:auto;margin:0 0 12px}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--sheet);border-radius:16px;padding:15px 18px;font-weight:700;margin-bottom:10px}
.fold .chev{transition:transform .2s}
.fold.open{border-radius:16px 16px 0 0;margin-bottom:0}
.fold.open .chev{transform:rotate(90deg)}
.foldbody{background:var(--sheet);border-radius:0 0 16px 16px;padding:0 18px 14px 38px;margin-bottom:10px;color:var(--steel)}
.foldbody li{padding:3px 0}
.sheet{background:var(--sheet);border-radius:18px;margin:10px 0 12px;overflow:hidden}
.sheet-h{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.sheet-h p{font-size:14px;color:var(--steel);text-align:right;line-height:1.3}
.sheet-h .rounds{color:var(--ink);font-weight:700}
.exr{border-top:1px solid var(--line)}
.exr:first-of-type{border-top:0}
.exr-h{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 16px 14px 18px}
.n{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;width:20px;flex:none;color:var(--steel);padding-top:1px}
.exr-b{flex:1;min-width:0}
.exr-name{display:block;font-weight:700;font-size:17px;line-height:1.25}
.exr-rx{display:block;margin-top:3px;color:var(--steel);font-size:15px}
.exr-rx b{font-family:var(--disp);font-weight:900;font-size:24px;color:var(--ink);margin-right:8px;letter-spacing:.01em}
.exr-wt{display:block;font-size:14px;margin-top:2px}
.exr-ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.exr-ic svg{width:26px;height:26px}
.exr-d{padding:0 18px 16px 52px}
.cue{color:var(--steel);font-size:15px;margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.log{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap;font-size:15px}
.log input[type=number]{width:86px}
.log label{display:flex;align-items:center;gap:8px;cursor:pointer}
.log input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.edit{display:flex;gap:8px;align-items:center;padding:0 18px 14px 52px;flex-wrap:wrap}
.step{display:flex;align-items:center;background:var(--soft);border-radius:10px;overflow:hidden}
.step button{width:38px;height:40px;font-size:20px;font-weight:700;text-align:center}
.step span{min-width:64px;text-align:center;font-size:14px;font-weight:700}
.edit input{width:130px}

/* forms */
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
input[type=text],input[type=number],input[type=search]{width:100%;background:var(--sheet);border:2px solid transparent;color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
.sheet input[type=number],.sheet input[type=text],.soft-in{background:var(--soft)}
input:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fitbox{background:var(--sheet);border-radius:16px;padding:16px 18px}
.fitrow{display:flex;align-items:baseline;gap:12px}
.fitv{font-family:var(--disp);font-weight:900;font-size:56px;line-height:.9}
.fitd{font-weight:700}
input[type=range]{width:100%;accent-color:var(--ink);margin-top:10px;height:30px}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq{background:var(--sheet);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;text-align:center;line-height:1.15;box-shadow:inset 0 0 0 2px transparent}
.eq svg{width:34px;height:34px;color:var(--steel)}
.eq.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.eq.on svg{color:var(--ink)}

/* library */
.libtools{display:flex;gap:8px;margin:2px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;margin-left:6px;padding:0 5px}
.lib{display:flex;gap:14px;align-items:flex-start;padding:14px 16px 14px 18px;border-top:1px solid var(--line)}
.lib:first-child{border-top:0}
.lib .exr-b{cursor:pointer}
.lvl{font-size:13px;color:var(--steel)}
.add{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:24px;font-weight:700;display:grid;place-items:center;flex:none}
.lib.sel .add{background:var(--ink);color:#fff}
.lib .cue{margin:8px 0 10px}

.note{font-size:14px;color:var(--steel);margin-top:18px}
.warn{background:#FCEBEC;color:#8E1C21;border-radius:14px;padding:12px 14px;font-size:15px;margin:10px 0}
.empty{background:var(--sheet);border-radius:18px;padding:28px 20px;text-align:center;color:var(--steel)}
textarea.copy{width:100%;height:220px;background:var(--sheet);border:0;border-radius:14px;padding:14px;font:inherit;font-size:14px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:20;font-size:15px;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* the one moment: plates load onto the bar */
.bbell .pl{animation:load .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 70ms + 80ms)}
@keyframes load{from{transform:translateX(var(--dx));opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bbell .pl{animation:none}*{transition:none!important}}
</style>

SLOTS.legs = SLOTS.lower;

function persist(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){mem=JSON.parse(JSON.stringify(S));} }

S.saved = S.saved||[]; S.logs = S.logs||{};

/* ============ HELPERS ============ */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];
function fmtW(w){ return w>=60&&w%60===0 ? (w/60)+" min" : w+" s"; }
function fmtRest(s){ if(!s) return ""; return s>=60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : s+" s"; }
function fit(){ return +(S.profile&&S.profile.fit)||5; }
function maxLevel(){ const f=fit(); return f<=3?1:f<=7?2:3; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
function ytUrl(e){ return "https://www.youtube.com/results?search_query="+encodeURIComponent(e.name+(e.type==="kb"?" kettlebell":"")+" exercise form tutorial"); }
function exIcon(e){
  const q=e.equip;
  if(q.includes("machine")) return "machine";
  if(q.includes("cable")) return "cable";
  if(q.includes("bb")) return q.includes("bench")&&e.pattern==="hpush" ? "bench" : "bb";
  if(q.includes("db")) return "db";
  if(q.includes("kb")||q.includes("kb2")) return "kb";
  for(const k of ["bar","dip","rings","band","rope","abwheel","box"]) if(q.includes(k)) return k;
  return "bw";
}
function ctxFor(where){
  if(where==="gym") return {set:new Set(EQUIP.map(x=>x[0])), kbs:GYM_KBS.slice()};
  const kbs=(S.equip.kbs||[]).slice().sort((a,b)=>a-b);
  return {set:new Set(S.equip.home||[]), kbs};
}
function avail(q,c){ if(q==="kb2") return c.set.has("kb") && c.kbs.length>=2; return c.set.has(q); }
function typeAvailable(type,where){
  const c=ctxFor(where);
  if(type==="cal") return true;
  if(type==="kb") return c.set.has("kb");
  if(type==="skip") return c.set.has("rope");
  if(type==="wt") return ["db","bb","band","cable","machine"].some(q=>c.set.has(q));
  return false;
}
function pool(type,c){
  return EX.filter(e=>{
    const ok = e.type===type || (type==="wt" && e.type==="cal" && e.equip.some(q=>["bar","dip","abwheel"].includes(q)));
    return ok && e.equip.every(q=>avail(q,c));
  });
}
function matches(e,spec){
  return spec.split("+").every(part=>{const [k,v]=part.split(":"); const o=v.split("|"); return k==="p"?o.includes(e.pattern):o.includes(e.group);});
}
function wpick(items,weights){ let t=weights.reduce((a,b)=>a+b,0), r=Math.random()*t; for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
function pickEx(cands,spec,used,goal,primary,circuit,where){
  let c=cands.filter(e=>!used.has(e.id)&&e.pattern!=="mob"&&!(circuit&&NO_CIRCUIT.has(e.id))&&matches(e,spec));
  if(!c.length) return null;
  if(primary){ const big=c.filter(e=>BIG.has(e.id)); if(big.length) c.splice(0,c.length,...big); }
  const w=c.map(e=>{
    let x=1;
    if(primary){ if(BIG.has(e.id)) x+=15; else if(COMPOUND.has(e.pattern)) x+=1; x+=e.level; if(e.equip.includes("bb")||e.equip.includes("db")) x+=2; if(e.unit!=="r") x*=.2; }
    if(e.equip.includes("band")) x*= (where==="gym"||primary)?.2:.4;
    if(circuit&&isUni(e)) x*=.4;
    if(goal==="cond"&&(e.pattern==="cond"||e.pattern==="power")) x+=2;
    if(goal==="strength"&&e.unit==="s") x*=.5;
    if(e.id==="bw-kneepu"&&fit()>3) x*=.1;
    if(["bw-scap","bw-negpull","cb-straight","db-pullover","kb-pullover"].includes(e.id)) x*=.25;
    return x;
  });
  return wpick(c,w);
}
function isUni(e){ return UNI.has(e.id); }
function params(e,goal,role){
  const f=fit(); let sets,reps,rest,work;
  if(goal==="strength"){ if(role==="p"){sets=f>=8?5:f<=3?3:4;reps="4–6";rest=150;work=30;} else {sets=3;reps="8–10";rest=90;work=40;} }
  else if(goal==="muscle"){ if(role==="p"){sets=f<=3?3:4;reps="6–8";rest=120;work=40;} else {sets=f<=3?2:3;reps="8–12";rest=60;work=45;} }
  else { sets=f<=3?2:3; reps="15–20"; rest=45; work=50; }
  if(e.type==="cal"){ reps = goal==="strength"?(role==="p"?"5–8":"8–12"):goal==="muscle"?"8–15":"15–25"; }
  if(SWINGY.test(e.id)) reps = goal==="strength"?"10":goal==="muscle"?"12–15":"20";
  if(e.pattern==="core"&&e.unit==="r"&&goal!=="endurance"&&!e.id.startsWith("kb-tgu")) reps="10–15";
  if(e.id==="kb-tgu"||e.id==="kb-halftgu") reps="3";
  if(e.id==="bw-negpull") reps="3–5, 5 s down";
  if(e.id==="bw-muscleup"||e.id==="bw-hspu") reps="3–5";
  if(e.unit==="s"){ reps = goal==="endurance"?"45–60 s":"30–45 s"; work=45; }
  if(e.unit==="m"){ reps = goal==="endurance"?"60 m":"30–40 m"; work=40; }
  if(isUni(e)&&e.unit!=="m"){ reps+=" /side"; work=Math.round(work*1.8); }
  return {sets,reps,rest,work};
}
function itemMins(it){ return it.sets*(it.work+it.rest)/60 + 0.5; }
function blockMins(b){
  if(b.kind==="circuit"){ const n=b.items.length; return b.rounds*n*(b.work+b.rest)/60 + (b.rounds-1)*1; }
  return b.items.reduce((a,it)=>a+itemMins(it),0);
}
function makeItem(e,goal,role){ return Object.assign({id:e.id,role},params(e,goal,role)); }

/* ============ ENGINE ============ */
let ctxWhere="home";
function buildStraight(cands,slots,goal,budget){
  const items=[], used=new Set(); let t=0,i=0,miss=0;
  const prim = goal==="strength"?2:goal==="muscle"?1:0;
  while(items.length<10 && miss<slots.length){
    const spec=slots[i%slots.length]; i++;
    const role=items.length<prim?"p":"a";
    const e=pickEx(cands,spec,used,goal,role==="p",false,ctxWhere);
    if(!e){miss++;continue;}
    miss=0;
    const it=makeItem(e,goal,role), m=itemMins(it);
    if(t+m>budget+2 && items.length>=3) break;
    used.add(e.id); items.push(it); t+=m;
  }
  // top up sets if time is left over
  let guard=0;
  while(budget-t>4 && guard++<20){
    const it=items.filter(x=>x.sets<5).sort((a,b)=>a.sets-b.sets)[0];
    if(!it) break; const add=(it.work+it.rest)/60; if(t+add>budget) break; it.sets++; t+=add;
  }
  return items.length?[{kind:"straight",title:"Main work",items}]:[];
}
function circuitTiming(type,goal){
  const f=fit();
  if(type==="skip" && goal==="endurance") return f<=3?[60,30]:f<=7?[120,30]:[180,30];
  if(goal==="endurance") return f<=3?[40,20]:[50,10];
  return f<=3?[30,30]:f<=7?[40,20]:[45,15];
}
function buildCircuits(cands,slots,goal,budget,type){
  const [work,rest]=circuitTiming(type,goal);
  const nC = type==="skip"?1:(budget>=40?2:1);
  const per=budget/nC, used=new Set(), blocks=[];
  for(let c=0;c<nC;c++){
    let N = type==="skip"?Math.min(6,Math.max(3,Math.round(per/6))):(per<=18?4:per<=28?5:6);
    const items=[]; let i=c, miss=0;
    while(items.length<N && miss<slots.length+2){
      const e=pickEx(cands,slots[i%slots.length],used,"cond",false,true,ctxWhere); i++;
      if(!e){miss++;continue;} miss=0; used.add(e.id);
      items.push({id:e.id,role:"c",sets:1,reps:e.unit==="m"?"carry for the interval":fmtW(work),rest:0,work:0});
    }
    if(!items.length) continue;
    const roundMin=items.length*(work+rest)/60;
    const rounds=Math.max(2,Math.floor((per+1)/(roundMin+1)));
    blocks.push({kind:"circuit",title:nC>1?"Circuit "+"AB"[c]:(type==="skip"?"Rope intervals":"Circuit"),rounds,work,rest,items});
  }
  return blocks;
}
function generate(w){
  const c=ctxFor(w.where), type=w.type; ctxWhere=w.where;
  let goal=w.goal, focus=w.focus, time=w.time;
  if(goal==="pick") goal = type==="skip"?"cond":"muscle";
  if(type==="skip"&&!["cond","endurance"].includes(goal)) goal="cond";
  if(focus==="pick"||!focus){
    const last=S.saved.find(s=>s.meta&&s.meta.type===type);
    const seq=type==="kb"?["full","lower","upper"]:["full","upper","lower"];
    focus = last&&seq.includes(last.meta.focus) ? seq[(seq.indexOf(last.meta.focus)+1)%seq.length] : "full";
  }
  if(type==="kb"&&!KB_SLOTS[focus]) focus = ["chest","shoulders","arms","push","pull"].includes(focus)?"upper":focus==="legs"?"lower":focus==="back"?"upper":"full";
  if(time==="pick"||!time) time=45;
  const budget=Math.max(10,time-8);
  const ml=maxLevel();
  let all=pool(type,c), cands=all.filter(e=>e.level<=ml);
  if(cands.length<4) cands=all;
  let blocks;
  if(type==="skip"){ blocks=buildCircuits(cands,["p:cond"],goal,budget,type); focus=null; }
  else if(goal==="cond"){
    const slots = focus!=="full" ? (type==="kb"?KB_SLOTS[focus]:SLOTS[focus]) : COND_SLOTS[type];
    blocks=buildCircuits(cands,slots,goal,budget,type);
  } else {
    const slots = type==="kb"?KB_SLOTS[focus]:SLOTS[focus];
    blocks=buildStraight(cands,slots,goal,budget);
  }
  return finalize({meta:{where:w.where,type,goal,focus,time,mode:"auto"},blocks});
}
function buildManual(d,ids){
  const goal = d.goal==="pick" ? (d.type==="skip"?"cond":"muscle") : d.goal;
  let blocks;
  const exs=ids.map(id=>EXM[id]);
  if(goal==="cond"||d.type==="skip"){
    const [work,rest]=circuitTiming(d.type,goal);
    blocks=[];
    for(let i=0;i<exs.length;i+=6){
      const chunk=exs.slice(i,i+6);
      blocks.push({kind:"circuit",title:exs.length>6?"Circuit "+"ABCD"[i/6]:(d.type==="skip"?"Rope intervals":"Circuit"),rounds:3,work,rest,
        items:chunk.map(e=>({id:e.id,role:"c",sets:1,reps:e.unit==="m"?"carry for the interval":fmtW(work),rest:0,work:0}))});
    }
  } else {
    const prim=goal==="strength"?2:goal==="muscle"?1:0; let n=0;
    const items=exs.map(e=>{ const role=(n<prim&&COMPOUND.has(e.pattern)&&e.unit==="r")?(n++,"p"):"a"; return makeItem(e,goal,role); });
    blocks=[{kind:"straight",title:"Main work",items}];
  }
  return finalize({meta:{where:d.where,type:d.type,goal,focus:null,time:null,mode:"manual"},blocks});
}
function finalize(s){
  s.id = s.id || ("s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  s.created = s.created || new Date().toISOString();
  recalc(s); s.title = titleOf(s); return s;
}
function recalc(s){
  const active=s.blocks.reduce((a,b)=>a+blockMins(b),0);
  s.mins=Math.round(active+8);
  const w=+(S.profile&&S.profile.weight)||80;
  const m=s.meta, mt=(MET[m.type]||MET.wt)[m.goal]||5;
  let met=mt;
  if(m.type==="skip"){ const b=s.blocks[0]; if(b){ const frac=b.work/(b.work+b.rest); met=mt*frac+3*(1-frac);} }
  else if(m.goal!=="cond"){ /* straight sets: MET already reflects rest-inclusive lifting */ }
  const kcal=(met*w*active + 3.5*w*5 + 2.5*w*3)/60;
  s.kcal=Math.round(kcal/10)*10;
}
function headOf(s){
  const m=s.meta;
  const h = m.focus ? FOCI[m.focus] : TYPES[m.type];
  const kind = m.focus ? {wt:" with weights",kb:" with kettlebells",cal:", bodyweight",skip:""}[m.type] : "";
  return {h, sub: GOALS[m.goal]+kind+(m.where==="gym"?" at the gym":" at home")};
}
function titleOf(s){ const x=headOf(s); return x.h+": "+GOALS[s.meta.goal].toLowerCase(); }
function swapItem(s,bi,ii){
  const b=s.blocks[bi], it=b.items[ii], e=EXM[it.id], c=ctxFor(s.meta.where);
  const inS=new Set(s.blocks.flatMap(x=>x.items.map(y=>y.id)));
  const all=pool(s.meta.type,c).filter(x=>!inS.has(x.id)&&x.pattern!=="mob");
  let alts=all.filter(x=>x.pattern===e.pattern&&x.group===e.group);
  if(!alts.length) alts=all.filter(x=>x.pattern===e.pattern);
  if(!alts.length) alts=all.filter(x=>x.group===e.group);
  if(!alts.length){ toast("No alternative with your kit"); return; }
  const lvl=alts.filter(x=>x.level<=maxLevel());
  const n=rnd(lvl.length?lvl:alts);
  if(b.kind==="circuit") b.items[ii]={id:n.id,role:"c",sets:1,reps:n.unit==="m"?"carry for the interval":fmtW(b.work),rest:0,work:0};
  else { const sets=it.sets; b.items[ii]=makeItem(n,s.meta.goal,it.role); b.items[ii].sets=sets; }
}

/* ============ WEIGHT MEMORY ============ */
function isLoaded(e){ return e.equip.some(q=>LOADED.includes(q)); }
function kbFor(e,kbs){
  if(!kbs.length) return null;
  const heavy=["hinge","squat","carry"].includes(e.pattern)||SWINGY.test(e.id);
  const light=["vpush","biceps","triceps","lat","traps","core","mob"].includes(e.pattern)||e.id==="kb-tgu";
  const i = heavy?Math.floor((kbs.length-1)*0.75):light?Math.floor((kbs.length-1)*0.25):Math.floor((kbs.length-1)*0.5);
  return kbs[i];
}
function nextKg(e,kg,kbs){
  if(e.equip.includes("kb")||e.equip.includes("kb2")){ const up=kbs.find(k=>k>kg); return up||kg; }
  if(e.equip.includes("bb")) return kg+2.5;
  if(e.equip.includes("db")) return kg+(kg<10?1:2);
  return kg+2.5;
}
function suggestion(e,s){
  if(!isLoaded(e)) return "";
  const c=ctxFor(s.meta.where), last=S.logs[e.id];
  const isKb=e.equip.includes("kb")||e.equip.includes("kb2");
  if(last&&last.kg){
    const nx=last.ok?nextKg(e,last.kg,c.kbs):last.kg;
    return last.ok&&nx!==last.kg ? `Last time ${last.kg} kg ✓ → try <b>${nx} kg</b>` : `Last time ${last.kg} kg → stay at <b>${last.kg} kg</b>`;
  }
  if(isKb){ const k=kbFor(e,c.kbs); return k?`Use the <b>${k} kg</b> bell`:""; }
  return "Pick a weight you could do 2 more reps with";
}
function defaultKg(e,s){
  const c=ctxFor(s.meta.where), last=S.logs[e.id];
  if(last&&last.kg) return last.ok?nextKg(e,last.kg,c.kbs):last.kg;
  if(e.equip.includes("kb")||e.equip.includes("kb2")) return kbFor(e,c.kbs)||"";
  return "";
}

/* ============ SHARE TEXT ============ */
function shareText(s){
  const L=[];
  const hd=headOf(s); L.push("💪 GymKompis: "+hd.h); L.push(hd.sub);
  L.push(`~${s.mins} min · ~${s.kcal} kcal`);
  L.push("");
  L.push("Warm-up: "+WARMUP[s.meta.type].join("; "));
  s.blocks.forEach(b=>{
    L.push("");
    if(b.kind==="circuit") L.push(`${b.title.toUpperCase()} – ${b.rounds} rounds, ${fmtW(b.work)} on / ${fmtW(b.rest)} off`);
    else L.push(b.title.toUpperCase());
    b.items.forEach((it,i)=>{
      const e=EXM[it.id];
      L.push(b.kind==="circuit" ? `${i+1}. ${e.name}` : `${i+1}. ${e.name} – ${it.sets}×${it.reps}, rest ${fmtRest(it.rest)}`);
    });
  });
  L.push("");
  L.push("Built with GymKompis 🏋️");
  return L.join("\n");
}

  pickFor(){
    const L=ui.lib, c=ctxFor(L.draft.where), ml=maxLevel();
    let opts=pool(L.draft.type,c).filter(e=>e.group===L.tab&&!L.sel.includes(e.id)&&e.pattern!=="mob");
    const easy=opts.filter(e=>e.level<=ml); if(easy.length>=2) opts=easy;
    const comp=opts.filter(e=>BIG.has(e.id)||COMPOUND.has(e.pattern)); let n=0;
    for(;n<2&&opts.length;n++){ const src=(n===0&&comp.length)?comp:opts; const e=rnd(src); L.sel.push(e.id); opts=opts.filter(x=>x.id!==e.id); const ci=comp.indexOf(e); if(ci>=0) comp.splice(ci,1); }
    render(); toast(n?`Added ${n}`:"Nothing left to add here");
  },
  finishLib(){ ui.session=buildManual(ui.lib.draft,ui.lib.sel); go("session"); },
  openEx(v){ ui.open=ui.open===v?null:v; render(); },
  fold(v){ ui[v]=!ui[v]; render(); },
  swap(v){ const [bi,ii]=parseIdx(v); swapItem(ui.session,bi,ii); recalc(ui.session); syncSaved(); render(); toast("Swapped"); },
  remove(v){ const [bi,ii]=parseIdx(v); const b=ui.session.blocks[bi]; b.items.splice(ii,1); if(!b.items.length) ui.session.blocks.splice(bi,1); recalc(ui.session); syncSaved(); render(); },
  sets(v){ const [bi,ii,d]=parseIdx(v); const it=ui.session.blocks[bi].items[ii]; it.sets=Math.max(1,Math.min(8,it.sets+d)); recalc(ui.session); syncSaved(); render(); },
  rounds(v){ const [bi,d]=parseIdx(v); const b=ui.session.blocks[bi]; b.rounds=Math.max(1,Math.min(12,b.rounds+d)); recalc(ui.session); syncSaved(); render(); },
  toggleEdit(){ ui.edit=!ui.edit; ui.open=null; render(); },
  save(){
    const s=ui.session, i=S.saved.findIndex(x=>x.id===s.id);
    if(i>=0){ S.saved.splice(i,1); persist(); toast("Removed from saved"); render(); return; }
    if(S.saved.length>=10){ ui.saveFull=true; render(); return; }
    S.saved.unshift(JSON.parse(JSON.stringify(s))); persist(); ui.saveFull=false; toast(`Saved, ${S.saved.length} of 10`); render();
  },
  logWeights(){
    const s=ui.session; let n=0;
    s.blocks.forEach(b=>{ if(b.kind==="circuit") return; b.items.forEach(it=>{ const e=EXM[it.id]; if(!isLoaded(e)) return;
      const kg=it.kg!=null&&it.kg!==""?+it.kg:+defaultKg(e,s);
      if(kg>0){ S.logs[it.id]={kg,ok:!!it.ok,date:new Date().toISOString().slice(0,10)}; n++; } }); });
    persist(); toast(n?`Saved ${n} weight${n>1?"s":""}`:"Open an exercise and enter the kg first");
  },
  share(){
    const s=ui.session, text=shareText(s);
    if(navigator.share){
      navigator.share({title:"GymKompis: "+s.title,text}).catch(err=>{ if(err&&err.name!=="AbortError"){ ui.shareFallback=true; render(); } });
      return false;
    }
    return true; // let the WhatsApp link open
  },
  copy(){
    const txt=shareText(ui.session);
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied, paste it anywhere"),()=>{ui.copyBox=true;render();}); }catch(e){ ui.copyBox=true; render(); }
  },
  openSaved(v){ ui.session=JSON.parse(JSON.stringify(S.saved[+v])); ui.wiz=null; go("session"); },
  delSaved(v){ S.saved.splice(+v,1); persist(); render(); toast("Deleted"); },
  askReset(){ ui.confirmReset=true; render(); },
  cancelReset(){ ui.confirmReset=false; render(); },
  doReset(){ try{localStorage.removeItem(KEY);}catch(e){} mem=null; S={profile:null,equip:{gym:true,home:[],kbs:[],dbMax:""},saved:[],logs:{}}; ui={screen:"welcome"}; render(); }
};
function syncSaved(){ const s=ui.session, i=S.saved.findIndex(x=>x.id===s.id); if(i>=0){ S.saved[i]=JSON.parse(JSON.stringify(s)); persist(); } }
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-a]"); if(!t||t.disabled) return;
  const f=A[t.dataset.a]; if(!f) return;
  const r=f(t.dataset.v,t,ev); if(r!==true) ev.preventDefault();
});
document.addEventListener("keydown",ev=>{ if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches('[role=button][data-a]')){ ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input",ev=>{
  const t=ev.target, k=t.dataset&&t.dataset.i; if(!k) return;
  if(k==="fit"){ document.getElementById("fitv").textContent=t.value; document.getElementById("fitd").textContent=fitWord(+t.value); return; }
  if(k==="q"){ ui.lib.q=t.value; ui.lib.open=null; render(); const el=document.getElementById("libq"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); return; }
  const [bi,ii]=parseIdx(t.dataset.v), it=ui.session.blocks[bi].items[ii];
  if(k==="reps") it.reps=t.value;
  if(k==="kg") it.kg=t.value;
  if(k==="ok") it.ok=t.checked;
  syncSaved();
});
document.addEventListener("change",ev=>{ const t=ev.target; if(t.dataset&&t.dataset.i==="ok"){ const [bi,ii]=parseIdx(t.dataset.v); ui.session.blocks[bi].items[ii].ok=t.checked; syncSaved(); }});
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
render();
</script>
</body>
