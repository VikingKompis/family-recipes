<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6b73c">
<meta name="description" content="Our family recipe book: Mom's Kook en Geniet, Sunday roasts and everything in between.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Family Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: kitchen-tile category grid on the home view, illustrated dish cards below; recipe view = hero art, ingredients rail + method column */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1f2a2e; --muted:#5d6b6c; --line:#d9dfd8;
  --accent:#1f6f5c; --accent-soft:#dcebe5; --spice:#d9932b; --tile:#e8ede6; --veg:#4f8a2e;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1b; --surface:#1c2426; --ink:#e7ece8; --muted:#9aa8a6; --line:#2e3a3b;
  --accent:#6cc3a8; --accent-soft:#22362f; --spice:#e8ac4f; --tile:#202a2b; --veg:#93cc6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1b; --surface:#1c2426; --ink:#e7ece8; --muted:#9aa8a6; --line:#2e3a3b;
  --accent:#6cc3a8; --accent-soft:#22362f; --spice:#e8ac4f; --tile:#202a2b; --veg:#93cc6e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.label{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-size:clamp(34px,6vw,52px);line-height:1.05}
.brand p{margin:6px 0 0;color:var(--muted)}
.search{flex:1 1 260px;max-width:360px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px 18px;border:2px solid transparent;border-radius:16px;background:var(--t,#eee);color:#3b2a22;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center}
.cat svg{width:32px;height:32px;color:#3b2a22}
.cat b{font-weight:700;font-size:14px;line-height:1.2}
.cat small{font:12px var(--mono);color:#6b5040;font-variant-numeric:tabular-nums}
.cat:hover{transform:translateY(-2px)}
.cat[aria-pressed="true"]{border-color:#3b2a22;box-shadow:3px 3px 0 #3b2a22}

.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list-head h2{font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;gap:8px;min-width:0}
.ph{aspect-ratio:4/3;max-width:100%;width:100%;border-radius:14px;overflow:hidden;background:var(--tile);display:grid;place-items:center;color:var(--accent);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ph > svg{width:44px;height:44px;opacity:.55}
.card:hover .ph img{transform:scale(1.04)}
.card h3{font-size:19px;line-height:1.2}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.veg{color:var(--veg)}
.chip.love{color:var(--spice)}
.ph .chip{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border:0;color:#7a4a12}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:46ch}

details.notes-ref{border-top:1px solid var(--line);padding-top:20px}
details.notes-ref summary{cursor:pointer;font-family:var(--display);font-size:22px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.notes-ref summary::after{content:"+";font-family:var(--mono);color:var(--accent)}
details.notes-ref[open] summary::after{content:"–"}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin-top:20px}
.ref-grid h3{font-size:18px;margin-bottom:10px}
.ref-grid table{width:100%;border-collapse:collapse;font-size:14px}
.ref-grid td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ref-grid td:last-child{text-align:right;color:var(--muted);padding-left:12px}
.ref-grid p{margin:0 0 10px;font-size:14px;color:var(--muted);max-width:60ch}

.back{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
.hero .ph{border-radius:18px}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--tile)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.intro{display:flex;flex-direction:column;gap:14px;min-width:0}
.intro h2{font-size:clamp(30px,5vw,44px);line-height:1.08}
.intro .summary{margin:0;color:var(--muted);font-size:17px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:1.6fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.facts div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.facts div+div{border-left:1px solid var(--line)}
.facts strong{font:500 15px/1.4 var(--body)}
.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.btn{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}

.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:40px;align-items:start}
.ingr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.ingr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ingr h3,.method h3,.note-box h3{font-size:22px}
.scale{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.scale button{border:0;background:none;width:32px;height:32px;font-size:18px}
.scale span{font:500 13px var(--mono);min-width:7ch;text-align:center;font-variant-numeric:tabular-nums}
.ingr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ingr li{display:grid;grid-template-columns:8.5ch 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.ingr li:last-child{border-bottom:0}
.ingr li.sec{display:block;border:0;padding:14px 0 2px;color:var(--accent)}
.qty{font:500 13.5px/1.6 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.ingr .note{color:var(--muted);font-size:13.5px}
.method{display:flex;flex-direction:column;gap:18px;min-width:0}
.method ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:18px}
.method li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:14px;max-width:66ch}
.method li::before{content:counter(s);font:400 22px/1.2 var(--display);color:var(--spice)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.note-box{border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.note-box.tips{background:var(--accent-soft)}
.note-box.pro{background:var(--surface);border:1px solid var(--line)}
.note-box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.source{font-size:13px;color:var(--muted)}
.status{font-size:14px;color:var(--muted)}
@media (max-width:760px){
  .hero,.body{grid-template-columns:1fr}
  .ingr{position:static}
}

/* list pages */
.list-hero{background:var(--t);color:#3b2a22;border-radius:22px;padding:16px 22px 22px;display:flex;flex-direction:column;gap:8px}
.list-hero .back{color:#3b2a22}
.lh-row{display:flex;align-items:center;gap:14px}
.lh-row svg{width:46px;height:46px;flex:none}
.lh-row h2{font-size:clamp(28px,5vw,42px);line-height:1.05}
.lh-row span{font:13px var(--mono);color:#6b5040}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip button{flex:none;border:2px solid transparent;border-radius:999px;padding:8px 14px;background:var(--t);color:#3b2a22;font-weight:600;font-size:14px}
.strip button[aria-current="true"]{border-color:#3b2a22;box-shadow:2px 2px 0 #3b2a22}
/* hero */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.logo .mini{width:44px;height:44px;border-radius:50%;background:#f6b73c;display:grid;place-items:center;overflow:hidden;border:2px solid #3b2a22}
.logo .mini svg{width:100%;height:100%;animation:none}
.logo b{font:400 22px/1 var(--display)}
.hero-band{position:relative;overflow:hidden;border-radius:26px;background:#f6b73c;color:#3b2a22;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:end;gap:8px;padding:30px 30px 0 34px;isolation:isolate}
.hero-band .doodles{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.28}
.hero-copy{display:flex;flex-direction:column;gap:14px;padding-bottom:30px;min-width:0}
.hero-copy .eyebrow{font:700 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#7a3d14}
.hero-copy h1{font-size:clamp(36px,6.4vw,64px);line-height:.98;letter-spacing:-.01em;color:#2b1d16}
.hero-copy p{margin:0;font-size:17px;max-width:42ch;color:#4a3022}
.pick{display:flex;align-items:center;gap:12px;background:#fffaf0;border:2.5px solid #3b2a22;border-radius:16px;padding:8px 14px 8px 8px;text-align:left;color:#3b2a22;max-width:420px;box-shadow:4px 4px 0 #3b2a22;transition:transform .15s,box-shadow .15s}
.pick:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #3b2a22}
.pick img{width:84px;height:63px;border-radius:10px;object-fit:cover;flex:none;border:2px solid #3b2a22}
.pick span{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick small{font:700 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#b4521c}
.pick b{font:400 18px/1.2 var(--display)}
.pick em{font-style:normal;font-size:13px;color:#7a5a44}
.moose-wrap{position:relative;align-self:end;justify-self:center;width:min(100%,360px)}
.moose{width:100%;height:auto;display:block}
.bubble{position:absolute;z-index:3;top:2%;right:-2%;background:#fff;border:3px solid #3b2a22;border-radius:20px;padding:10px 18px;font:400 clamp(20px,3.2vw,28px)/1 var(--display);color:#d23b2a;transform:rotate(6deg);box-shadow:4px 4px 0 #3b2a22;white-space:nowrap}
.bubble::after{content:"";position:absolute;bottom:-12px;left:22px;width:18px;height:18px;background:#fff;border-right:3px solid #3b2a22;border-bottom:3px solid #3b2a22;transform:rotate(45deg)}
.steam path{animation:rise 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes rise{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-6px);opacity:.45}}
.moose-wrap svg{animation:bob 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.2deg)}}
@media (max-width:700px){
  .hero-band{grid-template-columns:1fr;padding:24px 20px 0}
  .hero-copy{padding-bottom:4px}
  .moose-wrap{width:min(78%,300px)}
  .bubble{right:0;top:0}
}
@media (prefers-reduced-motion:reduce){.steam path,.moose-wrap svg{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

ke="none" opacity=".7"/> <path d="M120 192 Q118 208 122 222 Q128 228 132 220 Q136 206 134 192 Z" fill="#6b3f25" stroke-width="2.6"/> <path d="M110 180 Q126 194 142 180" fill="none" stroke-width="3.2"/> </g> </svg></span><b>Family Recipes</b></button>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

</div>

<script>
const ICONS = {
  all:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  mom:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19V5"/><path d="M12 13s-3-1.8-3-3.6A1.6 1.6 0 0 1 12 8.6a1.6 1.6 0 0 1 3 .8c0 1.8-3 3.6-3 3.6Z"/>',
  meat:'<path d="M15.5 4.5a5 5 0 0 1 4 6.5c-.9 2.6-4 4-6.5 3l-3.6 3.6a2 2 0 1 1-2.8 2.4 2 2 0 1 1 2.4-2.8L12.6 13.6c-1-2.5.4-5.6 3-6.5"/>',
  fish:'<path d="M3 12c3-5 9-6 13-3l5-3v12l-5-3c-4 3-10 2-13-3Z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/>',
  pies:'<path d="M3 13h18l-2 6H5Z"/><path d="M4 13c0-4 3.6-7 8-7s8 3 8 7"/><path d="M10 9l1 2M14 9l-1 2"/>',
  pasta:'<path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 11c0-3 2-5 4-5s4 2 4 5M10 11c0-2 1-3 2-3s2 1 2 3"/>',
  soups:'<path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M9 7c0-1.5 1.5-1.5 1.5-3M13 7c0-1.5 1.5-1.5 1.5-3"/>',
  sides:'<path d="M7 20l-1-11h12l-1 11Z"/><path d="M9 9V4M12 9V3M15 9V5"/>',
  breads:'<path d="M5 20v-8a4 4 0 0 1-1-6c1-2 4-2 8-2s7 0 8 2a4 4 0 0 1-1 6v8Z"/>',
  baking:'<path d="M5 12h14l-1.5 8h-11Z"/><path d="M5 12c0-4 3-7 7-7s7 3 7 7"/><path d="M12 5V3"/>',
  pancakes:'<ellipse cx="12" cy="17" rx="8" ry="2.5"/><ellipse cx="12" cy="13" rx="8" ry="2.5"/><ellipse cx="12" cy="9" rx="8" ry="2.5"/><path d="M11 6.5h3v2h-3Z"/>',
  desserts:'<path d="M3 20h18L12 6 3 20Z"/><path d="M5.5 16h13"/><path d="M12 6V3"/>',
};
const CATS = [
  ['meat','Meat & poultry'],['fish','Fish'],['pies','Pies & pastry'],['pasta','Pasta & bakes'],['soups','Soups & stews'],
  ['sides','Sides & basics'],['breads','Breads & buns'],['baking','Cakes & bakes'],['pancakes','Pancakes & treats'],['desserts','Desserts'],
];
const TINT = {all:'#f6b73c',mom:'#f4a7a0',meat:'#fbc9b3',fish:'#bfe0f4',pies:'#fbdd9e',pasta:'#f7c3b9',soups:'#cbe7b8',sides:'#e6e0a9',breads:'#efd3a8',baking:'#f6c6d6',pancakes:'#ffe39a',desserts:'#d9c8f4'};
const MOOSE_SVG = document.querySelector('.logo .mini svg').outerHTML;
document.querySelector('.logo .mini svg').setAttribute('viewBox','46 2 160 196');
const LINES = ['Feed Me!'];
const CAT_ORDER = Object.fromEntries(CATS.map((c,i)=>[c[0],i]));
const MOM_SRC = "Mom's cookbook";
const catName = id => id==='mom' ? "Mom's book" : (CATS.find(c=>c[0]===id)||[,'Other'])[1];
const inCat = (r,c) => c==='all' || (c==='mom' ? r.source===MOM_SRC : r.category===c);
const icon = (id,size) => `<svg viewBox="0 0 24 24" ${size?`width="${size}" height="${size}"`:''} fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||ICONS.all}</svg>`;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoUrl = id => '/_blob/'+id;
const artUrl = svg => 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
const mins = m => !m ? 'Make ahead' : m>=60 ? `${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}` : `${m} min`;

let recipes = [], loaded = false, cat = 'all', query = '', current = null, servings = null, photoIdx = 0;
let assets = null, canUpload = false, db = null, servingsFor = null;
const view = document.getElementById('view');

const FRAC = [[.25,'¼'],[.5,'½'],[.75,'¾']];
function num(v){
  if(v>=100) return String(Math.round(v/5)*5);
  if(v>=20) return String(Math.round(v));
  const w = Math.floor(v), f = v - w;
  for(const [x,ch] of FRAC) if(Math.abs(f-x)<.06) return (w?w:'')+ch;
  if(f<.06) return String(w);
  if(f>.94) return String(w+1);
  return String(Math.round(v*10)/10);
}
function qtyText(i, factor){
  if(i.qty==null) return '';
  let a = i.qty*factor, b = i.qtyTo!=null ? i.qtyTo*factor : null, u = i.unit||'';
  if(u==='ml' && a>=1000){ a/=1000; b = b!=null? b/1000 : null; u='l'; }
  else if(u==='g' && a>=1000){ a/=1000; b = b!=null? b/1000 : null; u='kg'; }
  const fmt = v => (u==='l'||u==='kg') ? String(Math.round(v*100)/100) : num(v);
  return fmt(a) + (b!=null ? '–'+fmt(b) : '') + (u ? ' '+u : '');
}

function sorted(list){
  return list.slice().sort((a,b)=>(CAT_ORDER[a.category]??99)-(CAT_ORDER[b.category]??99) || (a.order??999)-(b.order??999) || String(a.title).localeCompare(String(b.title)));
}
function cardImg(r){
  if(r.artSvg) return `<img src="${artUrl(r.artSvg)}" alt="" loading="lazy">`;
  if(r.photos&&r.photos.length) return `<img src="${photoUrl(r.photos[0])}" alt="" loading="lazy">`;
  return icon(r.category);
}

function counts(){ const c = {}; recipes.forEach(r=>{c[r.category]=(c[r.category]||0)+1; if(r.source===MOM_SRC) c.mom=(c.mom||0)+1;}); return c; }
const LISTS = () => [['all','Everything'],['mom',"Mom's book"]].concat(CATS);
function cardsHTML(list){
  return `<div class="grid">${list.map(r=>`
    <button class="card" data-id="${esc(r.id)}">
      <div class="ph">${cardImg(r)}${r.badge?`<span class="chip">${esc(r.badge)}</span>`:''}</div>
      <div class="label">${esc(catName(r.category))}</div>
      <h3>${esc(r.title)}</h3>
      <div class="meta"><span>${mins(r.totalMin)}</span><span>${esc(r.servesLabel||'')}</span>${r.veg?'<span class="chip veg">Veg</span>':''}</div>
    </button>`).join('')}</div>`;
}
function renderHome(){
  const c = counts();
  const tiles = LISTS().filter(([id])=>id==='all'||!loaded||c[id]).map(([id,name])=>`
    <button class="cat" data-cat="${id}" style="--t:${TINT[id]||'#eee'}">${icon(id)}<b>${name}</b><small>${id==='all'?recipes.length:(c[id]||0)} recipes</small></button>`).join('');
  let body;
  if(!loaded) body = `<p class="status">Opening the recipe box…</p>`;
  else if(!recipes.length) body = `<div class="empty">${icon('pies',40)}<h3>The book is ready for its first recipe</h3><p>Paste a recipe into the chat with Claude and it will appear here, filed under the right category.</p></div>`;
  else body = `<nav class="cats" aria-label="Categories">${tiles}</nav>`;
  view.innerHTML = `<section style="display:flex;flex-direction:column;gap:28px">
    ${hero()}
    <div style="display:flex;flex-direction:column;gap:16px"><div class="list-head"><h2>Pick a category</h2></div>${body}</div>
    ${reference()}
  </section>`;
}
function renderList(id){
  const isSearch = id==='search';
  const q = query.trim().toLowerCase();
  const list = sorted(recipes.filter(r=> isSearch
    ? [r.title, r.summary, ...(r.ingredients||[]).map(i=>i.item||'')].join(' ').toLowerCase().includes(q)
    : inCat(r,id)));
  const c = counts();
  const title = isSearch ? `Results for “${esc(query.trim())}”` : (id==='all'?'Everything':catName(id));
  const strip = LISTS().filter(([k])=>k==='all'||c[k]).map(([k,name])=>`<button data-cat="${k}" aria-current="${k===id}" style="--t:${TINT[k]}">${name}</button>`).join('');
  view.innerHTML = `<section style="display:flex;flex-direction:column;gap:22px">
    <div class="list-hero" style="--t:${isSearch?'#e8ede6':TINT[id]||'#eee'}">
      <button class="back" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Home</button>
      <div class="lh-row">${isSearch?'':icon(id)}<div><h2>${title}</h2><span>${list.length} recipe${list.length===1?'':'s'}</span></div></div>
    </div>
    ${isSearch?'':`<nav class="strip" aria-label="Other categories">${strip}</nav>`}
    ${!loaded?`<p class="status">Opening the recipe box…</p>`:list.length?cardsHTML(list):`<div class="empty"><h3>Nothing matches yet</h3><p>${isSearch?'Try an ingredient, like “banana” or “puff pastry”.':'No recipes here yet.'}</p></div>`}
  </section>`;
}

function todaysPick(){
  if(!recipes.length) return null;
  const pool = sorted(recipes.filter(r=>r.artSvg));
  const d = new Date(); const seed = d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
  return pool[(seed*2654435761 % 4294967296) % pool.length];
}
function hero(){
  const pick = todaysPick();
  const line = LINES[new Date().getDate() % LINES.length];
  const doodles = `<svg class="doodles" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="40" r="14"/><path d="M40 26 q4 -8 10 -6"/>
    <path d="M120 250 l40 -14 q6 2 0 6 l-40 14Z"/><path d="M160 234 l8 -6 M162 240 l9 -2"/>
    <path d="M300 30 q10 -14 20 0 q10 14 20 0"/><path d="M520 60 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0 M536 44 l0 -8"/>
    <path d="M440 260 q20 -30 40 0Z"/><path d="M60 170 l18 -18 l18 18 l-18 18Z"/><circle cx="250" cy="150" r="6"/><circle cx="380" cy="120" r="5"/>
    <path d="M560 200 l-30 30 M548 196 l16 16"/><path d="M200 80 q6 -10 12 0 q6 10 12 0 q6 -10 12 0"/></svg>`;
  return `<div class="hero-band">${doodles}
    <div class="hero-copy">
      <span class="eyebrow">Mom's book · Sunday roasts · Pudding night</span>
      <h1>What's cooking today?</h1>
      <p>${recipes.length||'All the'} family recipes, from Mom's Kook en Geniet to Saturday smash burgers.</p>
      ${pick?`<button class="pick" data-id="${esc(pick.id)}"><img src="${artUrl(pick.artSvg)}" alt=""><span><small>Today's pick</small><b>${esc(pick.title)}</b><em>${mins(pick.totalMin)} · ${esc(pick.servesLabel||'')}</em></span></button>`:''}
    </div>
    <div class="moose-wrap"><div class="bubble">${line}</div>${MOOSE_SVG}</div>
  </div>`;
}

function reference(){
  const sw = [['Plain flour','Vetemjöl'],['Strong bread flour','Vetemjöl Special'],['Wheat bran','Vetekli'],['Baking powder','Bakpulver'],['Bicarbonate of soda','Bikarbonat'],['Cornflour','Maizena majsstärkelse'],['Caster sugar','Strösocker'],['Icing sugar','Florsocker'],['Brown sugar','Farinsocker'],['Vanilla sugar','Vaniljsocker'],['Cream of tartar','Vinsyra'],['Whipping cream','Vispgrädde'],['Cooking cream','Matlagningsgrädde'],['Cream cheese','Färskost'],['Cottage cheese','Keso'],['Buttermilk','Kärnmjölk'],['Puff pastry','Smördeg'],['Shortcrust pastry','Mördeg / pajdeg'],['Beef chuck','Högrev'],['Pork neck','Fläskkarré'],['Pork tenderloin','Fläskfilé'],['Chicken thigh fillet','Kycklinglårfilé'],['Butternut squash','Butternutpumpa'],['Vanilla custard sauce','Vaniljsås']];
  const temps = [['Chicken, leftovers, casseroles','74°C'],['Beef or pork mince','71°C'],['Fish and whole cuts of beef, pork, lamb','63°C + 3 min rest'],['Pulled beef or ribs (for tenderness)','88–95°C']];
  return `<details class="notes-ref"><summary>Kitchen notes</summary><div class="ref-grid">
    <div><h3>Swedish shopping names</h3><table>${sw.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    <div><h3>Cooked when the centre reaches</h3><table>${temps.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
      <h3 style="margin-top:22px">Measures</h3>
      <p>Everything here is metric. 5 ml is a teaspoon, 15 ml a tablespoon, 100 ml a decilitre. Weigh flour, sugar and butter rather than measuring by volume.</p>
      <p>Conventional means top and bottom heat; fan means varmluft. Use the setting the recipe gives. Our oven runs hot, so check early.</p>
      <p>Cool cooked food within 2 hours in shallow containers, keep the fridge at 4°C or below, and reheat leftovers until piping hot.</p></div>
  </div></details>`;
}

function renderRecipe(r){
  const base = Number(r.serves)||null, f = base&&servings ? servings/base : 1;
  const photos = r.photos||[];
  const heroImg = photos.length ? `<img src="${photoUrl(photos[photoIdx]||photos[0])}" alt="${esc(r.title)}">` : r.artSvg ? `<img src="${artUrl(r.artSvg)}" alt="${esc(r.title)} illustration">` : icon(r.category,64);
  const ing = (r.ingredients||[]).map(i=> i.section
    ? `<li class="sec label">${esc(i.section)}</li>`
    : `<li><span class="qty">${qtyText(i,f)}</span><span>${esc(i.item)}${i.note?` <span class="note">(${esc(i.note)})</span>`:''}</span></li>`).join('');
  const unitWord = r.servesUnit||'';
  view.innerHTML = `<article style="display:flex;flex-direction:column;gap:36px">
    <button class="back" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>${lastList?'Back to '+esc(lastList==='cat-all'?'Everything':catName(lastList.slice(4))):'Home'}</button>
    <div class="hero">
      <div>
        <div class="ph">${heroImg}</div>
        ${photos.length>1?`<div class="thumbs">${photos.map((p,i)=>`<button data-ph="${i}" aria-current="${i===photoIdx}" aria-label="Photo ${i+1}"><img src="${photoUrl(p)}" alt=""></button>`).join('')}</div>`:''}
      </div>
      <div class="intro">
        <div class="label">${esc(catName(r.category))}</div>
        <h2>${esc(r.title)}</h2>
        ${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}
        ${(r.badge||r.veg)?`<div class="chips">${r.badge?`<span class="chip love">${esc(r.badge)}</span>`:''}${r.veg?'<span class="chip veg">Vegetarian</span>':''}</div>`:''}
        <div class="facts">
          <div><span class="label">Time</span><strong>${esc(r.time||mins(r.totalMin))}</strong></div>
          <div><span class="label">Makes</span><strong>${esc(r.servesLabel||'–')}</strong></div>
        </div>
        ${r.source?`<div class="source">${esc(r.source===MOM_SRC?"From Mom's Kook en Geniet":r.source==='Made with Claude'?'From the recipes we made with Claude':'From the family cookbook')}</div>`:''}
        ${canUpload?`<div class="upload"><label class="btn" for="addphoto">Add a photo</label><input id="addphoto" type="file" accept="image/*" hidden><span id="upmsg"></span></div>`:''}
      </div>
    </div>
    <div class="body">
      <aside class="ingr">
        <div class="ingr-head"><h3>Ingredients</h3>${base?`<div class="scale" aria-label="Scale the recipe"><button id="minus" aria-label="Make less">−</button><span>${servings}${unitWord?' '+esc(unitWord):''}</span><button id="plus" aria-label="Make more">+</button></div>`:''}</div>
        <ul>${ing}</ul>
      </aside>
      <section class="method">
        <h3>Method</h3>
        <ol>${(r.steps||[]).map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>
      </section>
    </div>
    ${(r.tips&&r.tips.length)||(r.proTips&&r.proTips.length)?`<div class="notes">
      ${r.tips&&r.tips.length?`<div class="note-box tips"><h3>Family notes &amp; variations</h3><ul>${r.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
      ${r.proTips&&r.proTips.length?`<div class="note-box pro"><h3>For a professional finish</h3><ul>${r.proTips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    </div>`:''}
  </article>`;
}

let lastList = '';
function goHome(){ query=''; document.getElementById('q').value=''; lastList=''; history.pushState('', '', location.pathname); render(); window.scrollTo(0,0); }
function render(){
  const h = (location.hash||'').slice(1);
  if(query.trim()){ current=null; renderList('search'); return; }
  if(h.startsWith('cat-')){ current=null; lastList=h; renderList(h.slice(4)); return; }
  current = h || null;
  const r = current && recipes.find(x=>x.id===current);
  if(r){ if(servingsFor!==r.id){ servings = Number(r.serves)||null; servingsFor = r.id; photoIdx = 0; } renderRecipe(r); }
  else { servingsFor = null; servings = null; photoIdx = 0; lastList=''; renderHome(); }
}

view.addEventListener('click', e=>{
  const c = e.target.closest('[data-cat]'); if(c){ query=''; document.getElementById('q').value=''; location.hash = 'cat-'+c.dataset.cat; window.scrollTo(0,0); return; }
  const card = e.target.closest('.card,.pick'); if(card){ servings=null; photoIdx=0; location.hash = card.dataset.id; window.scrollTo(0,0); return; }
  if(e.target.closest('#back')){
    if(current && lastList && !query.trim()){ location.hash = lastList; window.scrollTo(0,0); }
    else goHome();
    return; }
  if(e.target.closest('#plus')){ servings++; render(); return; }
  if(e.target.closest('#minus')){ if(servings>1) servings--; render(); return; }
  const t = e.target.closest('[data-ph]'); if(t){ photoIdx = +t.dataset.ph; render(); }
});
view.addEventListener('change', async e=>{
  if(e.target.id!=='addphoto' || !e.target.files[0]) return;
  const msg = document.getElementById('upmsg'); msg.textContent = 'Uploading…';
  try{
    const r = recipes.find(x=>x.id===current);
    const up = await assets.upload(e.target.files[0]);
    await db.collection('recipes').doc(r.id).update({photos:[...(r.photos||[]), up.id]});
    msg.textContent = 'Photo added';
  }catch(err){ msg.textContent = 'That photo could not be added. Try a smaller image (under 20 MB).'; }
});
document.getElementById('q').addEventListener('input', e=>{ query = e.target.value; render(); window.scrollTo(0,0); });
window.addEventListener('hashchange', render);
document.getElementById('home').addEventListener('click', goHome);

render();
(async()=>{
  try{
    const res = await fetch('recipes.json', {cache:'no-cache'});
    recipes = await res.json();
  }catch(e){ recipes = []; }
  loaded = true; render();
})();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>

</body>
</html>
